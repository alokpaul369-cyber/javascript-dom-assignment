<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Result Calculator</h1>
        <div class="input-group">
            <label>Bangla Marks</label>
            <input type="number" id="bangla" placeholder="Enter Bangla Marks">
        </div>
        <div class="input-group">
            <label>English Marks</label>
            <input type="number" id="english" placeholder="Enter English Marks">
        </div>
        <div class="input-group">
            <label>Math Marks</label>
            <input type="number" id="math" placeholder="Enter Math Marks">
        </div>
        <button onclick="calculateResult()">Calculate Result</button>
        <button class="reset" onclick="resetData()">Reset</button>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
